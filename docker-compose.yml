services:
  api:
    build: .
    image: eurosatory-scraper:latest
    container_name: eurosatory-api
    command: ["python", "-m", "uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

  ui:
    image: eurosatory-scraper:latest
    container_name: eurosatory-ui
    depends_on:
      - api
    command:
      [
        "python",
        "-m",
        "streamlit",
        "run",
        "app/ui/streamlit_app.py",
        "--server.port",
        "8501",
        "--server.address",
        "0.0.0.0",
      ]
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "8501:8501"

  pipeline:
    image: eurosatory-scraper:latest
    container_name: eurosatory-pipeline
    profiles: ["jobs"]
    command: ["python", "-m", "app.cli", "all"]
    env_file: .env
    volumes:
      - ./data:/app/data
